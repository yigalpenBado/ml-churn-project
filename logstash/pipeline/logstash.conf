# Réception des logs JSON envoyés par l'API FastAPI (une ligne JSON par log)
input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Le champ "response_time" (en ms) doit être numérique pour les visualisations Kibana
  if [response_time] {
    mutate { convert => { "response_time" => "float" } }
  }
  if [probability] {
    mutate { convert => { "probability" => "float" } }
  }
}

output {
  # Un index par jour : ml-churn-logs-2026.11.06, ...
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ml-churn-logs-%{+YYYY.MM.dd}"
  }
  # Affiche aussi les logs reçus dans `docker logs logstash` (utile pour déboguer)
  stdout { codec => rubydebug }
}
